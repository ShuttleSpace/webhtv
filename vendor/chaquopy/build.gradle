// vendor/chaquopy 根构建。改编自上游 product/build.gradle（17.2.0）：
//   - VERSION.txt 由仓库根改为本构建根目录读取（上游是 "$rootProject.projectDir/.."）；
//   - 本地 maven 发布仓库路径相应调整（本 vendor 不发布，仅为保持结构完整）。
buildscript {
    repositories {
        mavenCentral()
    }
}

subprojects {
    version = file("$rootProject.projectDir/VERSION.txt").text.trim()

    repositories {
        mavenCentral()
        google()
    }

    // Maven Central requires every JAR to come with javadoc and sources JARs.
    apply plugin: 'java'
    java {
        withJavadocJar()
        withSourcesJar()
    }

    apply plugin: 'maven-publish'
    publishing {
        repositories {
            maven { url = "$rootProject.projectDir/maven" }
        }
        publications.all {
            withoutBuildIdentifier()  // Make .module file reproducible.
            pom {
                name = "Chaquopy"
                description = "The Python SDK for Android"
                url = "https://chaquo.com/chaquopy/"
                licenses {
                    license {
                        name = "MIT License"
                        url = "https://opensource.org/licenses/MIT"
                    }
                }
                developers {
                    developer {
                        name = "Malcolm Smith"
                        email = "smith@chaquo.com"
                    }
                }
                scm {
                    connection = "scm:git:https://github.com/chaquo/chaquopy.git"
                    url = "https://github.com/chaquo/chaquopy"
                }
            }
        }
    }
}
