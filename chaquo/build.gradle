plugins {
    id 'com.android.library'
    id 'com.chaquo.python'
}

android {
    namespace = 'com.fongmi.chaquo'

    compileSdk libs.versions.compileSdk.get().toInteger()

    defaultConfig {
        minSdk libs.versions.minSdk.get().toInteger()
        targetSdk libs.versions.targetSdk.get().toInteger()
        python {
            // Chaquopy 17 only supports Python >= 3.10. Its pypi-13.1 mirror ships the
            // >=3.10 wheels tagged android_24 (API 24+), which Chaquopy rejects when the
            // project minSdk is 23. We keep 3.10 and use the vendored plugin in
            // vendor/chaquopy (MIN_SDK_VERSION=23 + --min-api-level floor 24, see
            // vendor/chaquopy/README.md), so the android_24 wheels are selected.
            // These pure-C packages (lxml, pycryptodome, ujson) load fine on API 23
            // at runtime.
            version = "3.10"
            pip {
                install("-r", "requirements.txt")
            }
        }
    }

    flavorDimensions = ["abi"]

    productFlavors {
        arm64_v8a {
            dimension "abi"
            ndk { abiFilters "arm64-v8a" }
        }
        armeabi_v7a {
            dimension "abi"
            ndk { abiFilters "armeabi-v7a" }
        }
    }

    sourceSets {
        main {
            python.srcDirs = ["src/main/python"]
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled = true
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

dependencies {
    implementation project(':catvod')
    coreLibraryDesugaring libs.desugar
}